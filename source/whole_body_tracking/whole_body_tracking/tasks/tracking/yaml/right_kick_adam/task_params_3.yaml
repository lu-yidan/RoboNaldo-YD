# ==============================================================================
#  BeyondMimic - Adam (Inspire, 29 DOF) Stage-3 (task) Hyperparameters
#  Adam variant of right_kick/task_params_3.yaml. Full task stage: higher goal
#  weights + adapt_motion / ontime_ball_reset to turn "kicks the ball" into
#  "scores". Resume from a Stage-2 checkpoint.
#  Robot-specific fields (main_foot_name, ee_body_pos links) use Adam URDF names.
#
#  GENTLER-CURRICULUM DEVIATION from G1 task_params_3 (why): jumping straight from
#  the Adam Stage-2 policy to G1's full Stage-3 randomization collapsed training
#  (99% ee_body_pos terminations, negative reward from step 1). Root cause: our
#  reference motion has a fixed facing, so G1's init_yaw_range=1.0 (+-57 deg) puts
#  the tracked end-effectors past the 0.6 m ee_body_pos bound at reset. So this
#  Adam bridge keeps the Stage-2 init distribution (small yaw/ball randomization,
#  start from frame 0, no jump) while turning on the Stage-3 GOAL objective
#  (goal_weight 1.0, error_ball_to_target 20, adapt_motion, ontime_ball_reset).
#  A later stage can re-introduce the large yaw / ball randomization once targeting
#  is solid. Softened vs G1: init_pos_range 1.0->0.5, init_vel_range 1.0->0.05,
#  init_yaw_range 1.0->0.3, std_difficulty 1.5->1.0, jump_flag off,
#  critical_frame_adaptive_sampling off, ee warmup 0.35->0.5.
#
#  DEVIATION from G1: self_collision stays false for Adam (consistent with the
#  working Stage-1/Stage-2 presets; Adam's URDF collision set trips at the default
#  pose otherwise). Revisit if self-penetration appears in playback.
#  NOTE: main_foot_name is read at module import to build the ball-contact sensor
#  prim path, so you MUST select this preset via WBT_TASK_PARAMS_YAML for Adam.
# ==============================================================================

# ---------------------------------------------------------------------------
# Reward group weights
# ---------------------------------------------------------------------------
stage: task
motion_weight: 1.0          # Overall scale for motion-imitation rewards
goal_weight: 1.0            # Overall scale for task-goal rewards (ball kick)
reg_weight: 0.25             # Overall scale for regularization penalties
goal_reward_burst_steps: 10
goal_reset_delay_steps: 100
shot_success_threshold: 0.5
shot_valid_steps: 500
start_time_sampling_fraction: 0.0  # Always initialize from reference frame 0.

# ---------------------------------------------------------------------------
# Episode initialization ranges (applied at every env reset)
# ---------------------------------------------------------------------------
init_pos_range: 0.5         # Half-width [m] of uniform ball XY spawn range (bridge: G1 uses 1.0)
init_vel_range: 0.05      # Half-speed [m/s] of uniform ball linear velocity spawn (bridge: G1 1.0)
init_pos_z_bound: 0.0       # Upper bound [m] for ball Z spawn offset (lower = 0)
init_vel_z_range: 0.0       # Half-speed [m/s] of ball Z velocity spawn (0 = static)
init_yaw_range: 0.3         # Half-angle [rad] of robot yaw perturbation at reset (bridge: G1 1.0)
static_ball_probability: 0.2  # Chance of zeroing the sampled reset velocity
stand_still_env_ratio: 0.05    # Fraction of envs assigned to stand-still training
lidar_stale_probability: 0.01 # Chance per env step that ball_pos_b reuses the previous lidar frame

ball_init_state_pos: [0.25, 1.0, 0.12] # [x, y, z]
ball_init_state_vel: [0.0, 0.0, 0.0] # [x, y, z]
std_difficulty_multiplier: 1.0        # bridge: G1 uses 1.5
                             # Divides the std of Gaussian reward kernels; larger
                             # value -> narrower reward peak -> harder task

# ---------------------------------------------------------------------------
# Simulation / physics
# ---------------------------------------------------------------------------
rigid_num: 20               # GPU rigid-body count exponent:
                             #   gpu_max_rigid_patch_count = 10 * 2^rigid_num
use_rough_terrain: false    # Add uneven raised tiles on top of the flat ground

# ---------------------------------------------------------------------------
# Robot / task identity  (Adam URDF names)
# ---------------------------------------------------------------------------
main_foot_name: "toeRight"
                             # Adam right foot link (== G1 right_ankle_roll_link).

# ---------------------------------------------------------------------------
# Domain randomization - velocity push range (world frame)
# ---------------------------------------------------------------------------
velocity_range:
  x:     [-1,  1]       # [m/s]  forward / backward push
  y:     [-0.5,  0.5]       # [m/s]  lateral push
  z:     [-0.2,  0.2]       # [m/s]  vertical push
  roll:  [-0.52, 0.52]      # [rad/s] roll angular velocity perturbation
  pitch: [-0.52, 0.52]      # [rad/s] pitch angular velocity perturbation
  yaw:   [-0.78, 0.78]      # [rad/s] yaw angular velocity perturbation

# ---------------------------------------------------------------------------
# Adapted motion and jump trigger
# adapt_motion_flag: rotate the anchor command toward the ball and move its position toward the ball.
# jump_flag: start near the critic frame when the ball is close to the robot
# with less than threshold_r meters in threshold_t seconds;
# ---------------------------------------------------------------------------
critic_frame_index: 245
critical_frame_adaptive_sampling: false   # bridge: G1 true (start from frame 0 like Stage-2)
critical_frame_sampling_window: 0         # bridge: G1 10
adapt_motion_flag: true
jump_flag: false                          # bridge: G1 true (avoid mid-motion episode starts for now)
use_ontime_ball_reset: true
anchor_xy_offset: [0.15, -0.1]
threshold_r: 0.25
threshold_t: 0.4
lambda_factor: 0.5



reward_overrides:
  motion:
    motion_global_anchor_pos:
      weight_scale:
        tracking: 0.5
        task: 0.1
      params:
        error_threshold: 0.0
    motion_global_anchor_ori:
      weight_scale:
        tracking: 0.5
        task: 0.1
      params:
        error_threshold: 0.0
    motion_body_pos:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_body_ori:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_body_lin_vel:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_body_ang_vel:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_feet_lin_vel:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
  regularization:
    action_rate_l2:
      weight: -0.15
    robot_alive:
      weight_scale: 1.0
    action_smoothness:
      weight_scale: -1
    feet_slip:
      weight_scale: -0.1
    no_fly:
      weight_scale: -0.1
    arm_default_pose:
      weight_scale: 0.2
    stand_still_base_anchor_vel:
      weight_scale: -2.0
    hand_height_penalty:
      weight_scale: -0.5
      params:
        max_height: 0.8
    arm_pitch_same_sign_penalty:
      weight_scale: -0.5
      params:
        deadband: 0.03
    ee_body_pos_termination_penalty:
      params:
        warmup_threshold: 0.5           # bridge: G1 0.35
  goal:
    goal_reward_burst:
      weight: 500.0
    cmd_global_com_pos:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    cmd_delta_com_pos:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    cmd_global_anchor_ori:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    cmd_velocity_tracking:
      weight_scale: 1.0
    error_ball_to_target:
      weight_scale: 20.0
    ball_over_line:
      weight_scale: 0.5
    robot_ball_contact_count:
      weight_scale: 1.0
    robot_ball_contact:
      weight_scale: 1.0
      params:
        goal_sigma: 2.0
        feet_sigma: 1.0
    ball_velocity:
      weight_scale: 0.5
    ball_contact_orientation:
      weight_scale: 5.0
    robot_feet_ball_distance:
      weight_scale: 0.5
      params:
        std: 0.5
    robot_com_ball_distance:
      weight_scale: 1.0
    robot_head_torso_ball_distance:
      weight_scale: 1.0
    penalize_weak_foot_contact:
      weight_scale: -0.5
    penalize_self_contact_feet:
      weight_scale: -0.2
termination_overrides:
  anchor_pos:
    threshold: 0.5
  ee_body_pos:
    threshold:
      toeLeft: 0.6
      toeRight: 0.6
      wristYawLeft: 0.5
      wristYawRight: 0.5
  self_collision: false
