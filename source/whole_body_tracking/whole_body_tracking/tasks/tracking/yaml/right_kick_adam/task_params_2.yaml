# ==============================================================================
#  BeyondMimic - Adam (Inspire, 29 DOF) Stage-2 (task) Hyperparameters
#  Adam variant of right_kick/task_params_2.yaml. Turns on the ball/goal rewards
#  on top of motion tracking. Resume from a Stage-1 (tracking) checkpoint.
#  Robot-specific fields (main_foot_name, ee_body_pos links) use Adam URDF names.
#  NOTE: main_foot_name is read at module import to build the ball-contact sensor
#  prim path, so you MUST select this preset via WBT_TASK_PARAMS_YAML for Adam.
# ==============================================================================

# ---------------------------------------------------------------------------
# Reward group weights
# ---------------------------------------------------------------------------
stage: task
motion_weight: 1.0          # Overall scale for motion-imitation rewards
goal_weight: 0.8            # Overall scale for task-goal rewards (ball kick)
reg_weight: 0.2             # Overall scale for regularization penalties
goal_reward_burst_steps: 10
goal_reset_delay_steps: 300
shot_success_threshold: 0.5
stand_still_env_ratio: 0.0    # Fraction of envs assigned to stand-still training

shot_valid_steps: 500
start_time_sampling_fraction: 0.0  # Always initialize from reference frame 0.

# ---------------------------------------------------------------------------
# Episode initialization ranges (applied at every env reset)
# ---------------------------------------------------------------------------
init_pos_range: 0.15        # Half-width [m] of uniform ball XY spawn range.
                             # Tightened 0.5->0.15: the right-foot strike sweet spot
                             # (measured from the ref motion) is a ~0.15 m window, so a
                             # 1 m-wide spawn box let the ball miss it most resets and
                             # the policy never learned to time the right-foot kick.
init_vel_range: 0.01         # Half-speed [m/s] of uniform ball linear velocity spawn
init_pos_z_bound: 0.0       # Upper bound [m] for ball Z spawn offset (lower = 0)
init_vel_z_range: 0.0       # Half-speed [m/s] of ball Z velocity spawn (0 = static)
init_yaw_range: 0.2         # Half-angle [rad] of robot yaw perturbation at reset
static_ball_probability: 0.05
lidar_stale_probability: 0.0

ball_init_state_pos: [0.17, 1.45, 0.12] # [x, y, z]
                             # Aligned to Adam's right-foot strike point measured from
                             # motions/right_kick_adam.npz: at the kick (frame ~265) the
                             # right toe passes (0.18, 1.47, 0.11) at 8.3 m/s forward.
                             # The inherited G1 value [0.25, 1.0, 0.12] sat ~0.47 m short
                             # in y (at the walk stride, not the power swing), so the ball
                             # got grazed during the walk-in instead of struck.
ball_init_state_vel: [0.0, 0.0, 0.0] # [x, y, z]
std_difficulty_multiplier: 1
                             # Divides the std of Gaussian reward kernels; larger
                             # value -> narrower reward peak -> harder task

# ---------------------------------------------------------------------------
# Simulation / physics
# ---------------------------------------------------------------------------
rigid_num: 20               # GPU rigid-body count exponent:
                             #   gpu_max_rigid_patch_count = 10 * 2^rigid_num
use_rough_terrain: false    # Add uneven raised tiles on top of the flat ground

# ---------------------------------------------------------------------------
# Robot / task identity  (Adam URDF names)
# ---------------------------------------------------------------------------
main_foot_name: "toeRight"
                             # Adam right foot link (== G1 right_ankle_roll_link).
                             # Used for ball-contact detection and kick reward.

# ---------------------------------------------------------------------------
# Domain randomization - velocity push range (world frame)
# ---------------------------------------------------------------------------
velocity_range:
  x:     [-0.5,  0.5]       # [m/s]  forward / backward push
  y:     [-0.5,  0.5]       # [m/s]  lateral push
  z:     [-0.2,  0.2]       # [m/s]  vertical push
  roll:  [-0.52, 0.52]      # [rad/s] roll angular velocity perturbation
  pitch: [-0.52, 0.52]      # [rad/s] pitch angular velocity perturbation
  yaw:   [-0.78, 0.78]      # [rad/s] yaw angular velocity perturbation

# ---------------------------------------------------------------------------
# Adapted motion and jump trigger
# ---------------------------------------------------------------------------
critic_frame_index: 250
adapt_motion_flag: false
jump_flag: false
use_ontime_ball_reset: false
critical_frame_adaptive_sampling: false
critical_frame_sampling_window: 0
anchor_xy_offset: [0.0, 0.0]
threshold_r: 0.2
threshold_t: 0.4
lambda_factor: 0.5


reward_overrides:
  motion:
    motion_global_anchor_pos:
      weight_scale:
        tracking: 0.5
        task: 0.1
      params:
        error_threshold: 0.0
    motion_global_anchor_ori:
      weight_scale:
        tracking: 0.5
        task: 0.1
      params:
        error_threshold: 0.0
    motion_body_pos:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_body_ori:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_body_lin_vel:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_body_ang_vel:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
    motion_feet_lin_vel:
      weight_scale: 1.0
      params:
        error_threshold: 0.0
  regularization:
    robot_alive:
      weight_scale: 1.0
    action_smoothness:
      weight_scale: -0.35
    feet_slip:
      weight_scale: -0.1
    no_fly:
      weight_scale: -0.1
    arm_default_pose:
      weight_scale: 0.2
    ee_body_pos_termination_penalty:
      params:
        warmup_threshold: 0.7
  goal:
    goal_reward_burst:
      weight: 500.0
    cmd_global_com_pos:
      weight_scale: 0.0
      params:
        error_threshold: 0.0
    cmd_delta_com_pos:
      weight_scale: 0.0
      params:
        error_threshold: 0.0
    cmd_global_anchor_ori:
      weight_scale: 0.0
      params:
        error_threshold: 0.0
    cmd_velocity_tracking:
      weight_scale: 0.0
    error_ball_to_target:
      weight_scale: 10.0
    ball_over_line:
      weight_scale: 0.5
    robot_ball_contact_count:
      weight_scale: 1.0
    robot_ball_contact:
      weight_scale: 1.0
      params:
        goal_sigma: 2.0
        feet_sigma: 1.0
    ball_velocity:
      weight_scale: 0.5
    ball_contact_orientation:
      weight_scale: 3.0
    robot_feet_ball_distance:
      weight_scale: 0.5
      params:
        std: 0.5
    robot_com_ball_distance:
      weight_scale: 1.0
    robot_head_torso_ball_distance:
      weight_scale: 1.0
    penalize_weak_foot_contact:
      weight_scale: -0.5
    penalize_self_contact_feet:
      weight_scale: -0.2
termination_overrides:
  anchor_pos:
    threshold: 0.5
  ee_body_pos:
    threshold:
      toeLeft: 0.5
      toeRight: 0.5
      wristYawLeft: 0.5
      wristYawRight: 0.5
  self_collision: false
